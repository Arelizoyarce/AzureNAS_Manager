# ---- Conexion a SQL Server (SSMS) ----
db.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
db.url=jdbc:sqlserver://localhost:1433;databaseName=gestion_almacenamiento;encrypt=true;trustServerCertificate=true
db.user=sa
db.password=123

# ---- Azure Storage SIMULADO (carpetas locales = File Shares / Blob Containers) ----
storage.base=${user.home}/azurenas-simulado

# ---- Clave para cifrar credenciales de cuentas de almacenamiento ----
app.clave=cambia-esta-clave-secreta

# ---- Ejecutor PowerShell (true = permite ejecutar cmdlets Get-* en el servidor) ----
powershell.habilitado=true
